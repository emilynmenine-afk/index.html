<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>

    <style>
        /* Estilos gerais do corpo da página */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #CD853F;
        }

        /* Estilo do cabeçalho principal */
        header {
            background-color: #A0522D;
            color: #000000;
            text-align: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 0 0 10px 10px;
        }

        /* Área do conteúdo principal */
        main {
            background-color: #8B4513;
            color: #000000;
            display: flex;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            gap: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Imagem */
        img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
        }

        /* Nome do autor */
        .artigo-autor {
            font-weight: bold;
            color: #000000;
        }

        /* Botões */
        button {
            padding: 8px 12px;
            margin-right: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        /* Botão depois de ser clicado */
        button.curtido {
            background-color: #ccc;
            cursor: not-allowed;
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <header>
        <h1>Perfume de excelência</h1>
        <p>Fluir nobre</p>
    </header>

    <main>

        <!-- Primeiro post -->
        <div>
            <img src="image.png" alt="perfume de qualidade">

            <h2>Meu perfume</h2>
            <p class="artigo-autor">Por: Emilyn</p>
            <p>Perfumes para vc.</p>

            <button class="botao-curtida">
                ❤️ <span>0</span>
            </button>

            <button class="botao-curtida">
                👍 <span>0</span>
            </button>
        </div>

        <!-- Segundo post -->
        <div>
            <h2>Meu primeiro post</h2>
            <p class="artigo-autor">Por: Emilyn</p>
            <p>Perfume francês</p>

            <button class="botao-curtida">
                ❤️ <span>0</span>
            </button>

            <button class="botao-curtida">
                👍 <span>0</span>
            </button>
        </div>

    </main>

    <script>
        // Seleciona todos os botões de curtida
        const botoes = document.querySelectorAll(".botao-curtida");

        botoes.forEach(function (botao) {

            botao.addEventListener("click", function () {

                // Verifica se o botão já foi clicado
                if (botao.classList.contains("curtido")) {
                    return;
                }

                // Encontra o número da curtida
                const texto = botao.querySelector("span");

                // Aumenta a quantidade de curtidas
                texto.textContent = Number(texto.textContent) + 1;

                // Marca o botão como já curtido
                botao.classList.add("curtido");

                // Desativa o botão
                botao.disabled = true;
            });

        });
    </script>

</body>

</html>
