
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>

    <style>
        /* Estilos gerais do corpo da página */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #2B1B14;
        }

        /* Estilo do cabeçalho principal */
        header {
            background-color: #4B2E24;
            color: #E6C79C;
            text-align: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 0 0 10px 10px;
        }

        /* Área do conteúdo principal */
        main {
            background-color: #3B261C;
            color: #E6C79C;
            display: flex;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            gap: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* Estilo da imagem */
        img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
        }

        /* Destaque para o nome do autor */
        .artigo-autor {
            font-weight: bold;
            color: #C49A6C;
        }

        /* Estilo dos botões */
        button {
            background-color: #8B5E3C;
            color: #FFF0D9;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #A87950;
        }

    </style>
</head>

<body>

    <header>
        <h1>perfume-nobre</h1>
        <p>perfumes</p>
    </header>

    <main>
        <img src="image.png" alt="perfume de qualidade">

        <div>
            <h2>Meu primeiro post</h2>

            <p class="artigo-autor">Por: Andrea Gugelmin</p>

            <p>Perfumes de qualidade.</p>

            <button>❤️ <span>0</span></button>

            <button>👍 <span>0</span></button>
        </div>
    </main>

</body>

<script>
    const botoes = document.querySelectorAll("button");

    botoes.forEach(function (botao) {
        botao.addEventListener("click", botaoClicado);

        function botaoClicado() {
            console.log("fui clicado");

            let texto = botao.querySelector("span");

            texto.textContent++;
        }
    });
</script>

</html>
