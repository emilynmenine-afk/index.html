
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>

    <style>
        /* Estilos gerais */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #2B1B14;
        }

        /* Cabeçalho */
        header {
            background-color: #5D4037;
            color: #F5DEB3;
            text-align: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 0 0 10px 10px;
        }

        /* Conteúdo principal */
        main {
            background-color: #795548;
            color: #FFF0D9;
            display: flex;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            gap: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* Imagem do perfume */
        img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
        }

        /* Autor */
        .artigo-autor {
            font-weight: bold;
            color: #E6C7A5;
        }

        /* Botões */
        button {
            background-color: #A1887F;
            color: #FFFFFF;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #4E342E;
        }

    </style>
</head>

<body>

    <header>
        <h1>perfume-nobre</h1>
        <p>Perfumes que encantam!</p>
    </header>

    <main>

        <img src="https://images.unsplash.com/photo-1594035910387-fea47794261f?w=500"
            alt="Frasco de perfume elegante">

        <div>
            <h2>Meu primeiro post</h2>

            <p class="artigo-autor">Por: Andrea Gugelmin</p>

            <p>Perfumes de qualidade, sofisticação e elegância para todos os momentos.</p>

            <button>❤️ <span>0</span></button>

            <button>👍 <span>0</span></button>
        </div>

    </main>

    <script>
        const botoes = document.querySelectorAll("button");

        botoes.forEach(function (botao) {
            botao.addEventListener("click", botaoClicado);

            function botaoClicado() {
                console.log("fui clicado");

                let texto = botao.querySelector("span");

                texto.textContent++;
            }
        });
    </script>

</body>
</html>
